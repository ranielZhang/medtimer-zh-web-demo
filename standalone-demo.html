  <div class="preview-context"><strong>MedTimer</strong><p>让用药安排清楚，服用心里有数</p><a href="https://github.com/ranielZhang/medtimer-zh-web-demo">查看 GitHub 源码 ↗</a></div>
  <div class="phone" id="phone"><div class="status-bar"><span id="clock">09:41</span><span class="status-signals">●●●　▰</span></div><div id="app" class="app"></div><div class="home-indicator"></div></div>
  <script>
const ALL_DAYS = [0, 1, 2, 3, 4, 5, 6];
const STATUSES = ['scheduled', 'raised', 'snoozed', 'taken', 'skipped'];
function id(prefix) { return prefix + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function dayKey(date) { return [date.getFullYear(), String(date.getMonth() + 1).padStart(2, '0'), String(date.getDate()).padStart(2, '0')].join('-'); }
function dateOf(day) { return new Date(+day.slice(0, 4), +day.slice(5, 7) - 1, +day.slice(8, 10)); }
function plusDays(day, offset) { const date = dateOf(day); date.setDate(date.getDate() + offset); return dayKey(date); }
function at(day, time) { return dateOf(day).getTime() + (+time.slice(0, 2) * 60 + +time.slice(3, 5)) * 60000; }
function validDoseAmount(amount) { return Number.isFinite(amount) && amount > 0 && Math.abs(amount * 2 - Math.round(amount * 2)) < 1e-9; }
function valid(state) { return !!(state && state.version === 1 && Array.isArray(state.medicines) && state.events && Array.isArray(state.audit)); }
function seed() {
  return { version: 1, medicines: [
    { id: 'm1', name: '维生素 B12（500μg）', color: '#a23b50', icon: '▣', stock: 50.5, unit: '片', threshold: 12, notes: '', tags: ['维生素', '日常'], reminders: [
      { id: 'r1', type: 'weekly', time: '07:00', amount: 2, days: ALL_DAYS.slice(), active: true }
    ] },
    { id: 'm2', name: 'Omega 3（EPA/DHA 500mg）', color: '#596b98', icon: '⬡', stock: 10, unit: '粒', threshold: 12, notes: '餐后', tags: ['营养补充'], reminders: [
      { id: 'r2', type: 'weekly', time: '08:00', amount: 1, days: ALL_DAYS.slice(), active: true },
      { id: 'r3', type: 'weekly', time: '09:00', amount: 1, days: ALL_DAYS.slice(), active: true }
    ] },
    { id: 'm3', name: '示例药品 C', color: '#7aab87', icon: '✣', stock: 18, unit: '片', threshold: 5, notes: '按已有方案', tags: [], reminders: [
      { id: 'r4', type: 'weekly', time: '16:00', amount: 1, days: [1, 2, 3, 4, 5], active: true }
    ] }
  ], events: {}, audit: [] };
}
function demoSeed(now = new Date()) {
  const state = seed(), today = dayKey(now), days = 30;
  state.medicines.forEach((medicine, medicineIndex) => {
    medicine.reminders.forEach((reminder, reminderIndex) => {
      for (let age = days - 1; age >= 0; age--) {
        const day = plusDays(today, -age), dueAt = at(day, reminder.time);
        if (!activeOn(reminder, day) || (age === 0 && dueAt > now.getTime())) continue;
        const skipped = (age + medicineIndex * 2 + reminderIndex * 3) % 7 === 3;
        const key = day + ':' + reminder.id, status = skipped ? 'skipped' : 'taken';
        state.events[key] = { key, day, medicineId: medicine.id, reminderId: reminder.id, name: medicine.name,
          amount: reminder.amount, unit: medicine.unit, status, dueAt, raisedAt: null,
          processedAt: Math.min(now.getTime(), dueAt + 15 * 60000), snoozeUntil: null,
          deducted: status === 'taken' ? reminder.amount : 0, manual: false };
      }
    });
  });
  return state;
}
function fullDemoSeed(now = new Date()) {
  const state = demoSeed(now);
  state.demoConcentrationParams = true;
  state.medicines[0].halfLifeHours = 12; state.medicines[0].peakTimeHours = 2;
  state.medicines[1].halfLifeHours = 6; state.medicines[1].peakTimeHours = 1;
  return state;
}
function activeOn(reminder, day) {
  if (!reminder.active) return false;
  if (reminder.type === 'cycle') {
    if (!reminder.cycleStart || !reminder.activeDays || !reminder.pauseDays) return false;
    const elapsed = Math.round((dateOf(day) - dateOf(reminder.cycleStart)) / 86400000);
    const period = Number(reminder.activeDays) + Number(reminder.pauseDays);
    return elapsed >= 0 && period > 0 && elapsed % period < reminder.activeDays;
  }
  return (reminder.days || ALL_DAYS).includes(dateOf(day).getDay());
}
function hasConcentrationParams(medicine) {
  const halfLifeHours = Number(medicine && medicine.halfLifeHours), peakTimeHours = Number(medicine && medicine.peakTimeHours);
  return Number.isFinite(halfLifeHours) && halfLifeHours > 0 && Number.isFinite(peakTimeHours) && peakTimeHours > 0;
}
function concentrationSeries(state, endDay, count = 7) {
  const days = count === 30 ? 30 : 7, startDay = plusDays(endDay, 1 - days);
  const startAt = at(startDay, '00:00'), endAt = at(plusDays(endDay, 1), '00:00');
  const samples = days === 7 ? 169 : 361, interval = (endAt - startAt) / (samples - 1);
  const takenEvents = history(state).filter(event => event.status === 'taken');
  return state.medicines.filter(hasConcentrationParams).map(medicine => {
    const halfLifeHours = Number(medicine.halfLifeHours), peakTimeHours = Number(medicine.peakTimeHours);
    const lookback = Math.min(30 * 86400000, (peakTimeHours + halfLifeHours * 10) * 3600000);
    const doses = takenEvents.filter(event => event.medicineId === medicine.id)
      .map(event => ({ at: event.processedAt || at(event.day, event.time), amount: Number(event.amount) }))
      .filter(event => Number.isFinite(event.at) && Number.isFinite(event.amount) && event.amount > 0 && event.at >= startAt - lookback && event.at < endAt);
    const raw = Array.from({ length: samples }, (_, index) => {
      const sampleAt = startAt + interval * index;
      return doses.reduce((total, dose) => {
        const elapsed = (sampleAt - dose.at) / 3600000;
        if (elapsed < 0) return total;
        // Demo approximation: rise linearly until the configured peak, then decay by the configured half-life.
        return total + dose.amount * (elapsed < peakTimeHours ? elapsed / peakTimeHours : Math.pow(0.5, (elapsed - peakTimeHours) / halfLifeHours));
      }, 0);
    });
    const peak = Math.max(0, ...raw);
    // Normalize each medicine against its own peak so the chart only communicates a relative trend.
    return { medicineId: medicine.id, name: medicine.name, color: medicine.color || '#536797', unit: medicine.unit,
      halfLifeHours, peakTimeHours, points: raw.map((value, index) => ({ x: index / (samples - 1), value: peak ? value / peak * 100 : 0 })) };
  });
}
function scheduled(state, day) {
  const rows = [];
  state.medicines.forEach(medicine => medicine.reminders.forEach(reminder => {
    const key = day + ':' + reminder.id;
    const event = state.events[key];
    if (!activeOn(reminder, day) && !event) return;
    rows.push({ key, day, medicine, reminder, event, status: event ? event.status : 'scheduled',
      dueAt: event && event.status === 'snoozed' ? event.snoozeUntil : at(day, reminder.time) });
  }));
  return rows.sort((a, b) => a.dueAt - b.dueAt || a.medicine.name.localeCompare(b.medicine.name));
}
function snapshot(row) { return { key: row.key, day: row.day, medicineId: row.medicine.id, reminderId: row.reminder.id,
  name: row.medicine.name, amount: row.reminder.amount, unit: row.medicine.unit, time: row.reminder.time,
  status: 'scheduled', dueAt: at(row.day, row.reminder.time), raisedAt: null, processedAt: null, snoozeUntil: null, deducted: 0, manual: false }; }
function findRow(state, key) { return scheduled(state, key.slice(0, 10)).find(row => row.key === key); }
function log(state, action, event, now) { state.audit.push({ at: now.getTime(), action, key: event.key, name: event.name }); }
function raise(state, key, now = new Date()) {
  const row = findRow(state, key); if (!row || row.status === 'taken' || row.status === 'skipped') return false;
  const event = row.event || snapshot(row); event.status = 'raised'; event.raisedAt = now.getTime(); event.snoozeUntil = null;
  state.events[key] = event; log(state, '提醒触发', event, now); return true;
}
function reconcile(state, now = new Date()) {
  let changed = false;
  scheduled(state, dayKey(now)).forEach(row => { if (['scheduled', 'snoozed'].includes(row.status) && row.dueAt <= now.getTime()) changed = raise(state, row.key, now) || changed; });
  return changed;
}
function snooze(state, key, minutes = 10, now = new Date()) {
  const row = findRow(state, key); if (!row || !['raised', 'snoozed'].includes(row.status)) return false;
  const event = row.event; event.status = 'snoozed'; event.snoozeUntil = now.getTime() + minutes * 60000;
  log(state, '延后提醒', event, now); return true;
}
function outcome(state, key, status, now = new Date()) {
  if (!['taken', 'skipped'].includes(status)) return false;
  const row = findRow(state, key); if (!row) return false;
  const event = row.event || snapshot(row); if (event.status === status) return false;
  const medicine = row.medicine;
  if (event.status === 'taken') medicine.stock = +(medicine.stock + event.deducted).toFixed(2);
  event.deducted = 0;
  if (status === 'taken') { event.deducted = Math.min(medicine.stock, event.amount); medicine.stock = +(medicine.stock - event.deducted).toFixed(2); }
  event.status = status; event.processedAt = now.getTime(); event.snoozeUntil = null;
  state.events[key] = event; log(state, status === 'taken' ? '确认服用' : '跳过本次', event, now); return true;
}

  function saveMedicine() {
    const form = ui.form, stock = Number(form.stock), threshold = Number(form.threshold);
    if (!form.name.trim() || !form.unit.trim() || !Number.isFinite(stock) || stock < 0 || !Number.isFinite(threshold) || threshold < 0) return alert('请填写有效的药品名称、单位和库存。');
    const halfLife = form.halfLifeHours === '' || form.halfLifeHours == null ? null : Number(form.halfLifeHours);
    const peakTime = form.peakTimeHours === '' || form.peakTimeHours == null ? null : Number(form.peakTimeHours);
    if ((halfLife == null) !== (peakTime == null) || (halfLife != null && (!Number.isFinite(halfLife) || halfLife <= 0 || !Number.isFinite(peakTime) || peakTime <= 0))) return alert('半衰期和达峰时间需同时填写，且都必须大于 0。');
    form.name = form.name.trim(); form.unit = form.unit.trim(); form.stock = stock; form.threshold = threshold; form.halfLifeHours = halfLife; form.peakTimeHours = peakTime;
    const index = state.medicines.findIndex(item => item.id === form.id);
    if (index < 0) { form.reminders = [{ id: M.id('r'), type: 'weekly', time: '08:00', amount: 1, days: M.ALL_DAYS.slice(), active: true }]; state.medicines.push(clone(form)); }
    else state.medicines[index] = clone(form);
    save(); ui.screen = 'main'; ui.tab = 'medicines'; render();
  }
  function openRule(id) {
    const medicine = med(ui.editingId), rule = medicine.reminders.find(item => item.id === id);
    ui.reminderId = rule ? rule.id : '';
    ui.rule = rule ? clone(rule) : { id: M.id('r'), type: 'weekly', time: '08:00', amount: 1, days: M.ALL_DAYS.slice(), active: true, cycleStart: M.dayKey(new Date()), activeDays: 21, pauseDays: 7 };
    ui.rule.cycleStart ||= M.dayKey(new Date());
    ui.rule.activeDays ??= 21;
    ui.rule.pauseDays ??= 7;
    ui.rule.days ||= M.ALL_DAYS.slice();
    ui.screen = 'reminder'; render();
  }
  function saveRule() {
    const r = ui.rule, amount = Number(r.amount), activeDays = Number(r.activeDays), pauseDays = Number(r.pauseDays);
    if (!r.time || !M.validDoseAmount(amount) || (r.type === 'weekly' && !r.days.length) || (r.type === 'cycle' && (!r.cycleStart || !Number.isInteger(activeDays) || activeDays < 1 || !Number.isInteger(pauseDays) || pauseDays < 1))) return alert('请检查时间、用量（按 0.5 为单位）和重复规则。');
    r.amount = amount; r.activeDays = activeDays; r.pauseDays = pauseDays;
    const medicine = med(ui.editingId), index = medicine.reminders.findIndex(item => item.id === r.id);
    if (index < 0) medicine.reminders.push(clone(r)); else medicine.reminders[index] = clone(r);
    save(); openMedicine(medicine.id);
  }
  function simulate() {
    ui.menu = false;
    const row = M.scheduled(state, M.dayKey(new Date())).find(item => ['scheduled', 'snoozed'].includes(item.status));
    if (!row) { render(); return alert('今天没有待触发的提醒。'); }
    M.raise(state, row.key); save(); ui.tab = 'overview'; ui.day = M.dayKey(new Date()); ui.screen = 'main'; ui.sheetKey = row.key; render();
  }
  app.addEventListener('click', event => {
    const control = event.target.closest('[data-action]'); if (!control) return;
    const action = control.dataset.action;
    if (action === 'close-sheet' && event.target.closest('.sheet') && event.target !== control) return;
    if (action === 'tab') { ui.tab = control.dataset.tab; ui.screen = 'main'; }
    else if (action === 'day' || action === 'calendar-day') ui.day = control.dataset.day;
    else if (action === 'week-prev' || action === 'week-next') ui.day = M.plusDays(ui.day, action === 'week-prev' ? -7 : 7);
    else if (action === 'filter') ui.filter = control.dataset.filter;
    else if (action === 'analysis') ui.analysis = control.dataset.mode;
    else if (action === 'month-prev' || action === 'month-next') { const d = M.dateOf(ui.day); d.setMonth(d.getMonth() + (action === 'month-prev' ? -1 : 1), 1); ui.day = M.dayKey(d); }
    else if (action === 'menu') ui.menu = !ui.menu;
    else if (action === 'simulate') return simulate();
    else if (action === 'reset') { ui.menu = false; if (confirm('恢复为虚构示例？当前预览数据会被重置。')) { state = createDemoSeed(); save(); ui.day = M.dayKey(new Date()); ui.screen = 'main'; ui.tab = 'overview'; } }
    else if (action === 'about') { ui.menu = false; alert('本项目参考开源 Android 应用 MedTimer 的界面与事件流程。数据仅保存在本机；网页预览和小程序原型均没有后台推送或医疗建议。'); }
    else if (action === 'event') { if (control.dataset.key.includes(':manual-')) return alert('这是一条补记记录。'); ui.sheetKey = control.dataset.key; }
    else if (action === 'close-sheet') ui.sheetKey = '';
    else if (action === 'event-op') { const key = ui.sheetKey, op = control.dataset.op; if (op === 'raise') M.raise(state, key); else if (op === 'snooze') M.snooze(state, key, 10); else M.outcome(state, key, op); ui.sheetKey = ''; save(); }
    else if (action === 'open-med') { if (med(control.dataset.id)) return openMedicine(control.dataset.id); }
    else if (action === 'add-med') return openMedicine(null);
    else if (action === 'save-med') return saveMedicine();
    else if (action === 'delete-med') { if (confirm('删除药品及提醒规则？已完成的历史事件会保留。')) { state.medicines = state.medicines.filter(item => item.id !== ui.editingId); save(); ui.screen = 'main'; ui.tab = 'medicines'; } }
    else if (action === 'add-rule') { if (!ui.editingId) return alert('请先保存药品，再添加提醒。'); return openRule(null); }
    else if (action === 'open-rule') return openRule(control.dataset.id);
    else if (action === 'weekday') { const day = Number(control.dataset.day); ui.rule.days = ui.rule.days.includes(day) ? ui.rule.days.filter(item => item !== day) : ui.rule.days.concat(day); }
    else if (action === 'save-rule') return saveRule();
    else if (action === 'delete-rule') { if (confirm('删除这条提醒？')) { const medicine = med(ui.editingId); medicine.reminders = medicine.reminders.filter(item => item.id !== ui.reminderId); save(); return openMedicine(medicine.id); } }
    else if (action === 'manual') { ui.manualId = state.medicines[0]?.id || ''; ui.manualAmount = 1; ui.screen = 'manual'; }
    else if (action === 'save-manual') { if (!M.manualDose(state, ui.manualId, Number(ui.manualAmount))) return alert('请选择药品并填写有效用量。'); save(); ui.screen = 'main'; ui.tab = 'overview'; ui.day = M.dayKey(new Date()); }
    else if (action === 'back') { if (ui.screen === 'reminder') return openMedicine(ui.editingId); ui.screen = 'main'; }
    render();
  });
  app.addEventListener('input', event => {
    const field = event.target.dataset.field; if (!field) return;
    const value = event.target.type === 'checkbox' ? event.target.checked : event.target.value;
    if (ui.screen === 'editor') { if (field === 'tags') ui.form.tags = value.split(/[,，]/).map(item => item.trim()).filter(Boolean); else ui.form[field] = value; }
    else if (ui.screen === 'reminder') ui.rule[field] = value;
    else if (ui.screen === 'manual') ui[field] = value;
  });
  app.addEventListener('change', event => { if (event.target.dataset.field === 'range') { ui.range = Number(event.target.value); render(); } else if (ui.screen === 'reminder' && event.target.dataset.field === 'type') { ui.rule.type = event.target.value; render(); } });
  M.reconcile(state, new Date()); save(); render();
  setInterval(() => { if (M.reconcile(state, new Date())) { save(); render(); } }, 15000);
  document.getElementById('clock').textContent = new Intl.DateTimeFormat('zh-CN', { hour: '2-digit', minute: '2-digit', hour12: false }).format(new Date());
}());

</script>
</body>
</html>
