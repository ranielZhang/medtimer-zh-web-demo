<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#e6e9fa">
  <meta name="description" content="MedTimer 家庭组双手机联动演示：家庭组创建者与奶奶成员端实时同步用药安排和记录。">
  <title>MedTimer · 家庭组双手机联动演示</title>
  <link rel="stylesheet" href="./styles.css?v=family-sync-2">
  <style>
    html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;color:#31333d}body{min-height:100vh;background:radial-gradient(circle at 22% 15%,#e1e8ff,#eae9f3 48%,#d9dce9);padding:32px 24px;box-sizing:border-box}.family-demo-shell{max-width:1120px;margin:auto}.family-demo-header{display:flex;align-items:center;justify-content:space-between;gap:20px;margin:0 auto 22px;max-width:940px}.family-brand{font-size:32px;line-height:1.1;font-weight:800;letter-spacing:-.04em}.family-tagline{font-size:16px;color:#58627c;margin-top:8px}.family-demo-controls{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.family-demo-status{font-size:12px;color:#536797;background:#dce3fb;border-radius:20px;padding:9px 13px}.family-reset{border:1px solid #b8c0d7;border-radius:20px;color:#526797;background:#ffffff80;padding:9px 14px;font-size:12px;cursor:pointer}.family-users{display:grid;grid-template-columns:repeat(2,minmax(360px,430px));justify-content:center;gap:34px}.family-user{min-width:0}.family-user-head{height:55px;display:flex;align-items:center;justify-content:space-between;padding:0 12px}.family-user-head strong{font-size:17px}.family-user-head span{font-size:12px;color:#73798a}.family-device{height:min(860px,calc(100vh - 160px));min-height:650px;width:100%;border:0;border-radius:40px;background:transparent;display:block;overflow:hidden}.family-demo-note{max-width:940px;margin:20px auto 0;text-align:center;font-size:12px;color:#757b8b;line-height:1.6}.family-demo-note strong{color:#536797}@media(max-width:820px){body{padding:18px 12px}.family-demo-header{align-items:flex-start;flex-direction:column;gap:12px}.family-brand{font-size:28px}.family-tagline{font-size:14px}.family-users{grid-template-columns:minmax(0,430px);gap:20px}.family-device{height:830px;min-height:700px}.family-user-head{height:45px}.family-demo-note{text-align:left;padding:0 4px}}
  </style>
</head>
<body>
  <main class="family-demo-shell">
    <header class="family-demo-header">
      <div><div class="family-brand">MedTimer</div><div class="family-tagline">用药安排清楚，服用心里有数</div></div>
      <div class="family-demo-controls"><span class="family-demo-status" id="family-status">家庭组 365970 · 两端实时联动</span><button class="family-reset" id="reset-demo">重置双手机演示</button></div>
    </header>
    <section class="family-users" aria-label="家庭组双手机演示">
      <article class="family-user"><header class="family-user-head"><strong>家人端 · 周女士</strong><span>家庭组创建者 / 管理员</span></header><iframe class="family-device" id="caregiver-phone" title="家庭组创建者手机页面"></iframe></article>
      <article class="family-user"><header class="family-user-head"><strong>奶奶端 · 奶奶</strong><span>家庭组普通成员</span></header><iframe class="family-device" id="grandma-phone" title="奶奶手机页面"></iframe></article>
    </section>
    <p class="family-demo-note"><strong>试试联动：</strong>家人端为奶奶添加药品和提醒（家人端不展示奶奶的服药提醒），再到奶奶端主页查看提醒并记录服用；药品设置、库存和用药记录会在两端同步。此演示通过同一浏览器模拟共享数据，不代表真实跨设备服务。</p>
  </main>
  <script>
    (() => {
      const shared = ['medtimer-family-preview-shared-state-v1', 'medtimer-family-preview-caregiver-v1', 'medtimer-family-preview-grandma-v1'];
      const codeKey = 'medtimer-family-preview-code-v1';
      if (!/^\d{6}$/.test(localStorage.getItem(codeKey) || '')) localStorage.setItem(codeKey, '365970');
      const status = document.getElementById('family-status');
      const syncCode = localStorage.getItem(codeKey);
      status.textContent = '家庭组 ' + syncCode + ' · 两端实时联动';
      const base = './index.html?familyPreview=';
      document.getElementById('caregiver-phone').src = base + 'caregiver&tab=overview';
      document.getElementById('grandma-phone').src = base + 'grandma&tab=overview';
      document.getElementById('reset-demo').addEventListener('click', () => {
        shared.forEach(key => localStorage.removeItem(key));
        localStorage.setItem(codeKey, '365970');
        status.textContent = '家庭组 365970 · 两端实时联动';
        document.getElementById('caregiver-phone').src = base + 'caregiver&tab=overview&reset=' + Date.now();
        document.getElementById('grandma-phone').src = base + 'grandma&tab=overview&reset=' + Date.now();
      });
    })();
  </script>
</body>
</html>
